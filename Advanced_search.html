<!DOCTYPE html>
<html lang="en">
    <head>
        <meta charset="UTF-8">
        <meta name="viewport" content="width=device-width, initial-scale=1.0">
        <title>Advanced Search</title>
        <link rel="stylesheet" href="style.css">
    </head>
    <body >
        <h2>Advanced search</h2>
        <hr>
        <div class="nav">    
        <a href="Google_search.html">Home Page</a>
        </div>
        <form action="https://www.google.com/search" id="form-advance" method="get">
            <div class="search-row">
            <label for="all-words">All of these words:</label>
            <input type="text" id="all-words" name="as_q" ></div>
            <div class="search-row">
            <label for="Exact-words">Exact phrase:</label>
            <input type="text" id="Exact-words" name="as_epq" ></div>
            <div class="search-row">
            <label for="any-words">Any of these words:</label>
            <input type="text" id="any-words" name="as_oq" ></div>
            <div class="search-row">
            <label for="none-words">None of these words:</label>
            <input type="text" id="none-words" name="as_eq"></div>
            <input type="submit" value="Advanced search" id="search-btn3">    
        </form>
    </body>
</html>
